name: mse-mooc-dev

x-backend-base-env: &backend-base-env
  APP_ENV: development
  LOG_LEVEL: debug
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-mse_mooc}
  POSTGRES_USER: ${POSTGRES_USER:-mse_mooc}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  POSTGRES_DSN: ${POSTGRES_DSN:-postgres://mse_mooc:change-me@postgres:5432/mse_mooc?sslmode=disable}
  POSTGRES_SSLMODE: disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC_USER_REGISTERED: mse-mooc.user.registered
  KAFKA_TOPIC_USER_ROLE_CHANGED: mse-mooc.user.role.changed
  KAFKA_TOPIC_COURSE_CREATED: mse-mooc.course.created
  KAFKA_TOPIC_COURSE_UPDATED: mse-mooc.course.updated
  KAFKA_TOPIC_GROUP_CREATED: mse-mooc.group.created
  KAFKA_TOPIC_GROUP_INVITE_CREATED: mse-mooc.group.invite.created
  KAFKA_TOPIC_GROUP_JOINED: mse-mooc.group.joined
  KAFKA_TOPIC_GRADE_ASSIGNED: mse-mooc.grade.assigned
  KAFKA_TOPIC_ENROLLMENTS: mse-mooc.enrollments
  ROLE_STUDENT: student
  ROLE_TEACHER: teacher
  ROLE_ADMIN: admin
  DEFAULT_USER_ROLE: student
  GROUP_INVITE_TTL: 72h
  GRADE_SCALE_MIN: "0"
  GRADE_SCALE_MAX: "100"
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 168h
  JWT_ISSUER: mse-mooc
  JWT_AUDIENCE: mse-mooc-web

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mse_mooc}
      POSTGRES_USER: ${POSTGRES_USER:-mse_mooc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me-redis}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  migrations:
    profiles: ["migrations"]
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://mse_mooc:change-me@postgres:5432/mse_mooc?sslmode=disable}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - sh
      - -ec
      - |
        psql "${POSTGRES_DSN}" -f /migrations/001_create_schema.up.sql

  api-gateway:
    profiles: ["apps"]
    build:
      context: ${API_GATEWAY_CONTEXT:-../backend}
      dockerfile: docker/api-gateway.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
      enrollment-service:
        condition: service_started
    environment:
      <<: *backend-base-env
      GATEWAY_PORT: 8080
      FRONTEND_ORIGIN: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
      FRONTEND_PORT: 80
    ports:
      - "8080:8080"

  auth-service:
    profiles: ["apps"]
    build:
      context: ${AUTH_SERVICE_CONTEXT:-../backend}
      dockerfile: docker/auth-service.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *backend-base-env
      AUTH_SERVICE_PORT: 8081
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-admin}
      BOOTSTRAP_ADMIN_ROLE: ${BOOTSTRAP_ADMIN_ROLE:-admin}
    ports:
      - "8081:8081"

  course-service:
    profiles: ["apps"]
    build:
      context: ${COURSE_SERVICE_CONTEXT:-../backend}
      dockerfile: docker/course-service.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *backend-base-env
      COURSE_SERVICE_PORT: 8082
    ports:
      - "8082:8082"

  enrollment-service:
    profiles: ["apps"]
    build:
      context: ${ENROLLMENT_SERVICE_CONTEXT:-../backend}
      dockerfile: docker/enrollment-service.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *backend-base-env
      ENROLLMENT_SERVICE_PORT: 8083
    ports:
      - "8083:8083"

  frontend:
    profiles: ["apps"]
    build:
      context: ${FRONTEND_CONTEXT:-../frontend}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"

volumes:
  postgres-data:
  redis-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
