apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: mse-mooc
  labels:
    app.kubernetes.io/name: course-service
spec:
  selector:
    app.kubernetes.io/name: course-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: mse-mooc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: course-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: course-service
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-postgres-kafka
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: course-service
          image: mse-mooc/course-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: COURSE_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: mse-mooc-app-config
                  key: COURSE_SERVICE_PORT
          envFrom:
            - configMapRef:
                name: mse-mooc-app-config
            - secretRef:
                name: mse-mooc-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 768Mi
