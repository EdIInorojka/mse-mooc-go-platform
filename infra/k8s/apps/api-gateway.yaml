apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mse-mooc
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mse-mooc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: edge
    spec:
      initContainers:
        - name: wait-for-backend-services
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z auth-service 8081; do echo waiting for auth-service; sleep 2; done
              until nc -z course-service 8082; do echo waiting for course-service; sleep 2; done
              until nc -z enrollment-service 8083; do echo waiting for enrollment-service; sleep 2; done
      containers:
        - name: api-gateway
          image: mse-mooc/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: mse-mooc-app-config
            - secretRef:
                name: mse-mooc-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
