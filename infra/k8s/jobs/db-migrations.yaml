apiVersion: batch/v1
kind: Job
metadata:
  name: mse-mooc-db-migrations
  namespace: mse-mooc
  labels:
    app.kubernetes.io/name: db-migrations
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrations
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql "$POSTGRES_DSN" <<'SQL'
              CREATE SCHEMA IF NOT EXISTS mse_mooc;
              SQL
          envFrom:
            - configMapRef:
                name: mse-mooc-app-config
            - secretRef:
                name: mse-mooc-secrets
