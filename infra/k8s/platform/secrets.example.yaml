apiVersion: v1
kind: Secret
metadata:
  name: mse-mooc-secrets
  namespace: mse-mooc
type: Opaque
stringData:
  POSTGRES_USER: mse_mooc
  POSTGRES_PASSWORD: change-me
  POSTGRES_DSN: postgres://mse_mooc:change-me@postgres:5432/mse_mooc?sslmode=disable
  JWT_SECRET: change-me-jwt-secret
  REDIS_PASSWORD: change-me-redis
  KAFKA_USERNAME: mse-mooc
  KAFKA_PASSWORD: change-me-kafka
  BOOTSTRAP_ADMIN_LOGIN: admin
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  BOOTSTRAP_ADMIN_PASSWORD: change-me-admin
  BOOTSTRAP_ADMIN_ROLE: admin
