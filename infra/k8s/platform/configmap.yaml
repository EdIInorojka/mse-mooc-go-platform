apiVersion: v1
kind: ConfigMap
metadata:
  name: mse-mooc-app-config
  namespace: mse-mooc
data:
  APP_ENV: production
  LOG_LEVEL: info
  FRONTEND_PORT: "80"
  GATEWAY_PORT: "8080"
  AUTH_SERVICE_PORT: "8081"
  COURSE_SERVICE_PORT: "8082"
  ENROLLMENT_SERVICE_PORT: "8083"
  FRONTEND_ORIGIN: http://mse-mooc.local
  CORS_ALLOWED_ORIGINS: http://mse-mooc.local
  AUTH_SERVICE_URL: http://auth-service:8081
  COURSE_SERVICE_URL: http://course-service:8082
  ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: mse_mooc
  POSTGRES_SSLMODE: disable
  POSTGRES_SCHEMA: mse_mooc
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC_USER_REGISTERED: mse-mooc.user.registered
  KAFKA_TOPIC_USER_ROLE_CHANGED: mse-mooc.user.role.changed
  KAFKA_TOPIC_COURSE_CREATED: mse-mooc.course.created
  KAFKA_TOPIC_COURSE_UPDATED: mse-mooc.course.updated
  KAFKA_TOPIC_GROUP_CREATED: mse-mooc.group.created
  KAFKA_TOPIC_GROUP_INVITE_CREATED: mse-mooc.group.invite.created
  KAFKA_TOPIC_GROUP_JOINED: mse-mooc.group.joined
  KAFKA_TOPIC_GRADE_ASSIGNED: mse-mooc.grade.assigned
  KAFKA_TOPIC_ENROLLMENTS: mse-mooc.enrollments
  ROLE_STUDENT: student
  ROLE_TEACHER: teacher
  ROLE_ADMIN: admin
  DEFAULT_USER_ROLE: student
  GROUP_INVITE_TTL: 72h
  GRADE_SCALE_MIN: "0"
  GRADE_SCALE_MAX: "100"
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 168h
  JWT_ISSUER: mse-mooc
  JWT_AUDIENCE: mse-mooc-web
